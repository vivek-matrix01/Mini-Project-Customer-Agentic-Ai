server:
  port: ${PORT:8080}

spring:
  application:
    name: nexus-ai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/MiniProject}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: nexus-async-

# ── JWT Security ─────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:nexus-ai-default-dev-secret-change-in-production-32chars}
  expiration-ms: 3600000

# ── AI Microservice Endpoints ────────────────────────────────
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000/analyze}
    chat-url: ${AI_CHAT_URL:http://localhost:8000/chat}

# ── CORS Allowed Origins (Optional extra origins) ─────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ── Swagger / OpenAPI Documentation ──────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
